[DeadSpace1Patch]
StartingSuitIncludeDefault=0
StartingSuitRandomizer=1
StartingSuitDiagnostics=1

; Live main-menu checkpoint browser. Press F9, select with arrows/page keys,
; apply with Enter/F8, close with F9, then choose New Game in an unused slot. This does work during a live game session.
; Switching checkpoints and starting a new game will teleport you to the specified location and progress.
CheckpointChanger=1
CheckpointChangerHotkey=120

; Disabled while the checkpoint changer is tested in isolation. The previous
; run reached the Workshop override successfully, then crashed while the two
; progression hooks were active during New Game loading.
ProgressionRandomizer=0
ProgressionRandomizerDiagnostics=0
ProgressionManifest=DeadSpace1Progression.tsv
; Isolated New Game test: randomize the two initial shop weapon unlocks while
; leaving schematics and restored PlayerStore data untouched.
StartingStoreRandomizer=1
ExistingSaveStoreMigration=0
; Diagnose: vertauscht das Paar auch im 26-Eintraege-Katalog des ShipStore.
; Die Liste, die wir bisher beschrieben haben, ist Spieler+0x1610; der
; Katalog des Ladens liegt bei ShipStore+0x794. Damit klaert sich, woraus
; die Anzeige gebaut wird. 0 = aus.
ProgressionStoreCatalog=0

; Keep enemy work out of this progression test.
SpawnsPerTrigger=0
EnemyRandomizer=0
EnemyRandomizerGlobalTemplates=0
EnemyRandomizerGlobalStreaming=0
EnemyRandomizerDiagnostics=0
SpawnCatalog=0
SpawnResolverDiagnostics=0
DiscoverClasses=0
EnemyRandomizerChancePercent=100
EnemyRandomizerContextV1=0
EnemyRandomizerForcedVariant=
EnemyRandomizerCrossFamilyContexts=0
EnemyRandomizerRetryFailedSpawns=0
EnemyRandomizerSeed=0x000D5A11

; Varianten, die trotz gueltigem Vertrag nicht in den Topf sollen.
; Semikolon-getrennt. leaper bleibt in Wandschaechten haengen.
EnemyRandomizerDisabledVariants=lurker;leaper;super_leaper

; --- Zusatzgegner: setzt einen Gegner, den das Level nie hatte ----------
; Wenn dieser Spawner ausloest, wird zusaetzlich die gewaehlte Art gesetzt.
; Die Quelle ist die source_uid aus DeadSpace1_OfflineSpawnContextCatalog.tsv.
; spawn_zombie_01_tram_repair in Kapitel 1:
; Aus: das setzte an jedem Spawner einen Guardian. Die Zeilen unten in
; [ExtraSpawns] koennen alles, was diese drei Schalter konnten, und mehr.
ExtraSpawnSource=
ExtraSpawnVariant=
ExtraSpawnCount=1

; --- Seltenheit je Variante ------------------------------------------
; 10 ist neutral. 1 macht eine Art rund zehnmal seltener als ihre
; Mitbewerber, ohne sie auszuschliessen. Der Hunter ist unbesiegbar,
; deshalb soll eine Begegnung ein Ereignis bleiben.
EnemyRandomizerWeight_hunter=1

; Die vier Schachtarten als eine behandeln. Die Oberflaechen-Einstufung
; ist eine Heuristik ueber den naechsten Marker im selben Archiv; wo
; Spawner und Marker in getrennten Archiven liegen, versagt sie ganz.
; Die Spawn-Weise dagegen steht authored im Paket des Gegners.
; 0 stellt die strenge Zuordnung wieder her.
EnemyRandomizerIgnoreVentSurface=1

; Charakterarchive laden, sobald das Kapitelarchiv fertig ist und keine
; FuncSpawns mehr entstehen - also noch im Ladebildschirm, aber nach dem
; Punkt, an dem der Lader zweimal haengen geblieben ist. 0 wartet
; stattdessen auf den ersten Kampf; das kostet einen Gegner, ist aber
; der erprobte Weg.
EnemyRandomizerPinAtWorldBuilt=0
; ExtraSpawnSource=any setzt den Zusatzgegner an jedem bekannten Spawner;
; ExtraSpawnChancePercent steuert, wie oft. Der Wurf haengt am Seed, ein
; Checkpoint-Neustart wiederholt ihn also.
ExtraSpawnChancePercent=100

; --- Standortanzeige --------------------------------------------------
; F10 im geladenen Level schreibt deine eigene Position und Blickrichtung
; ins Log, dazu jeden Spawner in der Naehe mit Entfernung, Namen, wohin er
; zeigt (Wand/Decke/Boden) und wie viele Gegner er machen darf. Daher
; kommen die Namen und die Koordinaten unten. 121 ist F10, 0 schaltet ab.
PlacementHotkey=1

; --- Welteditor, Stufe 1: sehen was da ist -----------------------------
; Hakt sich in die Konstruktoren der Weltklassen ein und fuehrt Buch ueber
; die erzeugten Objekte. F11 schreibt dann alles im Umkreis von 40 Metern
; ins Log: Klasse, GUID, Entfernung, Position. Reines Lesen.
WorldEditor=1
WorldEditorHotkey=122

; --- Noclip ------------------------------------------------------------
; F7 schaltet um. Pfeiltasten bewegen entlang der Blickrichtung, Bild auf
; und Bild ab hoch und runter, Umschalt beschleunigt dreifach.
; Die Position wird jede Abfrage neu geschrieben, sonst zieht die Schwerkraft
; zwischen zwei Ticks. Geschwindigkeit in Zentimetern je Abfrage.
NoClip=1
NoClipHotkey=118
NoClipSpeedCm=50

; =====================================================================
; Zusatzgegner: eine Zeile je Platzierung.
;   Spawnername = Gegnerart, Anzahl, Prozent [, x, y, z]
; Den Spawnernamen bekommst du im Spiel: stell dich in den Raum und
; druecke F10. "any" gilt fuer jeden bekannten Spawner. Die Prozente
; haengen am Seed, ein Checkpoint-Neustart wiederholt den Wurf also.
;
; Die drei Zahlen am Ende sind optional und setzen eine eigene Position.
; Ohne sie erscheint der Gegner dort, wo der Spawner steht - richtig fuer
; einen Schacht, wenn die Art da rausklettern kann, falsch fuer einen
; Guardian, der dann im Schacht sitzt. Stell dich hin, wo er hin soll,
; druecke F10 und uebernimm deine Spielerposition aus dem Log.
;
; Ob die Art zum Ort passt, wird geprueft: ein Schacht-Trigger sucht
; zuerst einen Schacht-Spender. Gibt es fuer die Art keinen, wird
; trotzdem gesetzt und das Log sagt "mismatched donor" - dann braucht die
; Zeile eine eigene Position.
;
; Arten: slasher, twitcher, super_slasher, female_slasher, exploder,
; leaper, super_leaper, lurker, pregnant, hunter, guardian, brute,
; divider_core, swarm.
[ExtraSpawns]
; Deine bisherige Zeile. Der Guardian landet damit im Schacht.
; spawn_zombie_01_tram_repair=guardian,1,100,-9.80,-20.50,-54.31

; Dieselbe Stelle mit eigener Position: Semikolon hier weg, eines vor die
; Zeile darueber, und die drei Zahlen durch die aus F10 ersetzen.
; spawn_zombie_01_tram_repair=guardian,1,100,-11.0,-21.0,-51.6

; Zwei zusaetzliche Twitcher aus dem allerersten Schacht des Spiels.
; Beide klettern normal raus, also keine Position noetig.
; spawn_first_vent_slasher=twitcher,2,100

; Ein Lurker im Hangar, aber nur in jedem vierten Durchlauf.
; spawn_zombie_01_hangar=lurker,1,25

; Ein Exploder im Tramtunnel. Wand, Decke und Boden sind ihm alle recht.
; spawn_zombie_01_tram_tunnel=exploder,1,100

; Eine Pregnant neben der schlafenden Leiche in Gang B. Pregnants werden
; immer gesetzt, kommen nie aus Schaechten - also Position aus F10.
; spawn_zombie_01_hallb_sleeping=pregnant,1,100,0.0,0.0,0.0

; Selten und fies: ein Hunter an fuenf Prozent aller Spawner im Level.
; Erst einen benannten Spawner testen, bevor du das anmachst.
; any=hunter,1,5


