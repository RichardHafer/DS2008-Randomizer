[SpawnerRules]
; One authored spawner per line, by the name the F10 readout prints or by its GUID.
; keep               the authored enemy always stays
; family:<Class>     only enemies of that family (Zombie, Lurker, Leaper, Exploder,
;                    Pregnant, Infector, Brute, Hunter)
; variant:<variant>  only that variant (twitcher, super_slasher, zombievar1, ...)
; A family or variant rule picks among what the randomizer allows at that spawner;
; naming the Hunter also lifts its limits there. Saved while the game runs, the
; rules apply from the next spawn on. Examples:
; spawn_quarantine_zombie_3=keep
; spawn_cc_leaper_1=family:Lurker
; spawn_triage_super_slasher=variant:twitcher
