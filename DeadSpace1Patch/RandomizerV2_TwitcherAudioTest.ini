[DeadSpace1Patch]

; Controlled first validation for the surface-aware tables and persistent
; audio stage. Copy these values into DeadSpace1Patch.ini for the test only.
SpawnsPerTrigger=1

EnemyRandomizer=1
EnemyRandomizerChancePercent=100
EnemyRandomizerSeed=0x00D5A11
EnemyRandomizerContextV1=1
EnemyRandomizerForcedVariant=twitcher

; Twitcher is a Zombie actor-class variant, so this remains fail-closed and
; does not enable general cross-family replacement yet.
EnemyRandomizerCrossFamilyContexts=0
EnemyRandomizerCrossFamilyGround=0

EnemyRandomizerGlobalTemplates=1
EnemyRandomizerGlobalStreaming=1
EnemyRandomizerDiagnostics=1
SpawnCatalog=0
SpawnResolverDiagnostics=0
DiscoverClasses=0
