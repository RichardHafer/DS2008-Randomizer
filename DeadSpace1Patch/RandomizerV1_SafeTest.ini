[DeadSpace1Patch]

; Isolate the randomizer: never multiply the result during this test.
SpawnsPerTrigger=1

EnemyRandomizer=1
EnemyRandomizerChancePercent=100
EnemyRandomizerSeed=0x00D5A11
EnemyRandomizerContextV1=1

; First test boundary: same actor class only (including Slasher -> Twitcher).
EnemyRandomizerCrossFamilyContexts=0
EnemyRandomizerCrossFamilyGround=0

; Load character packages, the required audio banks and the collision-free
; target sidecars before encounters start.
EnemyRandomizerGlobalTemplates=1
EnemyRandomizerGlobalStreaming=1

; Useful for the first controlled run; disable after validation.
EnemyRandomizerDiagnostics=1
SpawnCatalog=0
SpawnResolverDiagnostics=0
DiscoverClasses=0
