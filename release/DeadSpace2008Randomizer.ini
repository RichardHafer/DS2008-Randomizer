; Dead Space 2008 Randomizer 1.0.4 for Dead Space (2008), Steam version.
; DeadSpace2008RandomizerConfig.exe edits this file. Changes take effect on the next game start.
; Start a new game after changing the seed or any randomizer setting.

[DeadSpace2008Randomizer]
; ---- Enemies ----
EnemyRandomizer=1
; Whole number from 0 to 4294967295. The same seed with the same settings gives the same run.
EnemyRandomizerSeed=2060640533
EnemyRandomizerChancePercent=100
EnemyRandomizerSource_Zombie=1
EnemyRandomizerSource_Lurker=1
EnemyRandomizerSource_Leaper=1
EnemyRandomizerSource_Exploder=1
EnemyRandomizerSource_Infector=1
EnemyRandomizerSource_Pregnant=1
EnemyRandomizerContextV1=1
EnemyRandomizerCrossFamilyContexts=1
EnemyRandomizerScriptedVariants=1
EnemyRandomizerDirectSpawns=1
EnemyRandomizerHeavyFamilies=1
EnemyRandomizerIgnoreVentSurface=1
EnemyRandomizerDifficultyRamp=1
; Late variants (Supers, twitchers, sup_expl, hunter) take at most this share of a family, of a zero G pair
; and of a substitution (percent, 100 = no cap).
EnemyRandomizerLateCapPercent=40
EnemyRandomizerHunterChance=15
EnemyRandomizerZeroGVariants=1
; The enemy pool loaded from ds1_randomizer_assets. Both keys work as one switch.
EnemyRandomizerGlobalTemplates=1
EnemyRandomizerGlobalStreaming=1
EnemyRandomizerKeepCharacterArchives=1
; The enemy pool stays loaded while a level plays (zone changes cannot take it); it reloads with each new world.
EnemyRandomizerPersistentPool=1
; Experimental: the enemy characters also stay through deaths and chapter changes; archives with sound banks
; reload with every world.
EnemyRandomizerNeverUnload=1
; Model suits built with their own leg lengths: the plugin lengthens the legs in every animation.
LegLengthCorrection=1
; Enemy voices from every chapter stay loaded so a replaced enemy is never silent.
EnemyRandomizerAudioPreload=1
; A trigger that fires while the enemy pool is still loading waits for it (at most 20 s)
; instead of keeping the original enemy, so load speed never changes the run.
EnemyRandomizerHoldForPool=1
EnemyRandomizerPinAtWorldBuilt=1
DeathMessageTransplant=1
Watchdog=1
; Remove dead spawned enemies that never became ragdolls after ten seconds.
DeadBodySweep=1
WatchdogRelease=1
WatchdogReleaseWaitingTrigger=1
WatchdogLeashSeconds=90
WatchdogProbeSeconds=20
; A replacement the game removes while it is still alive sends the death message its room waits for.
WatchdogReleaseOnVanish=1
; Scripted enemies that play a cutscene animation keep their original enemy (chapter 1, door to Tram Control).
EnemyRandomizerKeepSceneActors=1
; If a replaced scripted enemy never finishes its scene, the plugin ends it after this many seconds (10 to 300).
SceneGateFallback=1
SceneGateFallbackSeconds=30
; A replacement that climbs out of a vent uses the vent of the enemy it replaces.
EnemyRandomizerSourceVentAnchor=1

; ---- More enemies (1 is the original count) ----
EnemyType_Zombie=1
EnemyType_Lurker=1
EnemyType_Leaper=1
EnemyType_Exploder=1
EnemyType_Infector=1
EnemyType_SwarmEnemy=1
EnemyType_Brute=1
EnemyType_Pregnant=1
EnemyType_DividerCore=1
; Each ordinary necromorph kind gets its weak limb moved for the whole run (bosses and story enemies keep theirs).
LimbWeakSpotRandomizer=1
; Each ordinary kind takes the limb profile of another species instead (overrides the weak spot setting).
LimbProfilePool=0
; Rotate how much overall health an enemy loses when each limb comes off.
LimbSeverCostRandomizer=1

; ---- Loot and items ----
LootRandomizer=1
LootWeightRandomizer=1
LootScarcity=0
; 1: ammo and credits from pickups grow with half the extra the More enemies counts add; 0: the two
; percentages below.
LootAutoScale=1
LootAmmoPercent=100
LootCreditsPercent=100
LooseItemRandomizer=1
CrateRandomizer=1
; While crates are shuffled: Power Nodes per chapter in breakable crates, in percent of the chapter's own.
CratePowerNodePercent=100
; Drop tables pick from the whole game's item set (their weights still apply).
LootGlobalPool=1
; The seed picks one loot scarcity for the run (-15 to +35) instead of LootScarcity.
LootScarcityRandom=1
; Every collectable audio, text and video log grants another log; SameChapter keeps them in their chapter.
LogRandomizer=1
LogRandomizerSameChapter=0

; ---- Progression ----
FirstWeaponRandomizer=1
ProgressionRandomizer=1
ProgressionManifest=DeadSpace1Progression.tsv
ProgressionSeeded=1
ProgressionStoreGate=1
ProgressionStartingWeapons=1
StartingSuitRandomizer=0
StartingSuitCreditShare=50
; The random starting suit may also be the ordinary level 1 suit.
StartingSuitIncludeDefault=1
; Experimental: rotate which upgrade nodes each bench offers.
UpgradeBenchRandomizer=1
; Store: PageUp/PageDown (or LT/RT) jump a page, Ctrl+PageUp/PageDown to the first/last item
StoreFastScroll=1
StoreScrollPage=10
StoreScrollController=1

; ---- World ----
LevelOrderRandomizer=1
OxygenRandomizer=1

; ---- Extras ----
SkipTutorialTips=1
MenuVersionLabel=1
; F9 opens the overlay: the checkpoint browser in the main menu, and TAB to the cheats.
CheckpointChanger=1
; Cheats page in the F9 overlay: give weapons and ammo, change the suit, switch noclip,
; god mode and the damage multiplier on the fly. Everything there starts off.
CheatsMenu=1
; God mode, also as a toggle key (decimal Windows key code, 116 = F5, 0 = none).
GodMode=0
GodModeHotkey=0
; Enemies take this many times the damage (1 = off). With a key it starts off and the key toggles it (117 = F6).
DamageMultiplier=1
DamageMultiplierHotkey=0
; Writes a crash dump next to the game when it crashes. Attach it to a bug report.
CrashDumps=1
EnemyRandomizerDiagnostics=0

; ---- Engine limits ----
; Sound banks the game can hold at once. The retail game has 35, which the extra
; enemy voices can fill (chapter 1 alone used 58). 96 by default, 35 keeps the retail table.
SoundBankSlots=96
SlotListGuard=1
PlayerQueryGuard=1

; ---- Console DLC add-on ----
; Read only when the Console DLC add-on is installed; without it these keys do nothing.
ConsoleDlc=1
ConsoleDlcMaterials=0
SuitSlots=64
; A seed may play the whole run in one DLC style (its suits from level 1 and its weapons).
SuitPaths=1
SuitPathWeaponPacks=1
; RIG bars in a colour per suit style (RigColour_<Style> = R,G,B or off). The first start after a change writes
; recoloured copies of the DLC suits.
RigColours=1
